name: Release App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ cpputest

      - name: Configure project
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build app
        run: cmake --build build --target App

      - name: Package app artifact
        run: |
          mkdir -p dist
          cp build/src/App dist/basic_cpp-linux-x64
          tar -czf dist/basic_cpp-${{ github.ref_name }}-linux-x64.tar.gz -C dist basic_cpp-linux-x64
          sha256sum dist/basic_cpp-${{ github.ref_name }}-linux-x64.tar.gz > dist/basic_cpp-${{ github.ref_name }}-linux-x64.tar.gz.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/basic_cpp-${{ github.ref_name }}-linux-x64.tar.gz
            dist/basic_cpp-${{ github.ref_name }}-linux-x64.tar.gz.sha256
          generate_release_notes: true
